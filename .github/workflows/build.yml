# ============================================================
# Compilar AresGalaxy (Windows, Win32)
# ============================================================
# SE EJECUTA AUTOMATICAMENTE EN CADA PUSH a master/main
# y tambien manualmente (Actions -> Run workflow).
#
# INSTALACION DE DEPENDENCIAS (automatica en Actions):
#   - FastMM4, TntUnicode, DSPack y Ares_VCLs se descargan e
#     instalan solas en cada ejecucion (paso 1 del job).
#
# COMPILADOR DELPHI (unico requisito externo):
#   Los runners de GitHub NO incluyen Delphi y la version gratuita
#   (Community Edition) bloquea el compilador de linea de comandos,
#   por lo que NO se puede instalar automaticamente. Se activa la
#   compilacion con UNA de estas dos opciones:
#
#   1) Secreto DELPHI_SETUP_URL (Settings -> Secrets -> Actions):
#      URL de tu instalador/portable de Delphi (no CE). Se descarga,
#      instala en silencio y compila en cada push.
#
#   2) Runner self-hosted: ejecuta el workflow manualmente marcando
#      "use_self_hosted=true" (requiere Delphi instalado en tu PC).
#
# Sin Delphi el build termina en verde con un aviso (no compila).
# ============================================================

name: Compilar AresGalaxy

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:
    inputs:
      use_self_hosted:
        description: "Usar mi runner local (self-hosted) con Delphi ya instalado"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: Build Ares.exe (Win32)
    runs-on: ${{ inputs.use_self_hosted == true && 'self-hosted' || 'windows-latest' }}
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar dependencias (FastMM4, TntUnicode, DSPack, Ares_VCLs)
        timeout-minutes: 8
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $libsDir = Join-Path $env:GITHUB_WORKSPACE '_libs'
          New-Item -ItemType Directory -Force -Path $libsDir | Out-Null
          $libs = @(
            @{ name = 'FastMM4';    check = 'FastMM4.pas';   urls = @('https://github.com/pleriche/FastMM4/archive/refs/heads/master.zip') },
            @{ name = 'TntUnicode'; check = 'TntForms.pas';  urls = @('https://github.com/rofl0r/TntUnicode/archive/refs/heads/master.zip') },
            @{ name = 'DSPack';     check = 'DSPack.pas';    urls = @('https://github.com/amikey/dspack/archive/refs/heads/master.zip') },
            @{ name = 'ares_vcls';  check = 'CometTrees.pas'; urls = @(
              'https://downloads.sourceforge.net/project/aresgalaxy/aresgalaxy/Ares_VCLs/Ares_VCLs_011713.zip',
              'https://master.dl.sourceforge.net/project/aresgalaxy/aresgalaxy/Ares_VCLs/Ares_VCLs_011713.zip?viasf=1',
              'https://phoenixnap.dl.sourceforge.net/project/aresgalaxy/aresgalaxy/Ares_VCLs/Ares_VCLs_011713.zip?viasf=1'
            ) }
          )
          $ok = 0
          foreach ($lib in $libs) {
            $zip = Join-Path $env:RUNNER_TEMP ($lib.name + '.zip')
            $descargado = $false
            foreach ($url in $lib.urls) {
              for ($i = 1; $i -le 2; $i++) {
                try {
                  Invoke-WebRequest -Uri $url -OutFile $zip -UseBasicParsing -TimeoutSec 240
                  $descargado = $true
                  break
                } catch {
                  Write-Host "Intento $i fallido para $($lib.name) desde $url : $($_.Exception.Message)"
                  Start-Sleep -Seconds 5
                }
              }
              if ($descargado) { break }
            }
            if (-not $descargado) {
              Write-Host "::warning::No se pudo instalar $($lib.name) tras todos los reintentos"
              continue
            }
            try {
              Expand-Archive -Path $zip -DestinationPath (Join-Path $libsDir $lib.name) -Force
              $unit = Get-ChildItem $libsDir -Recurse -Filter $lib.check -ErrorAction SilentlyContinue | Select-Object -First 1
              if ($unit) {
                Write-Host "[OK] $($lib.name) instalada (unidad $($lib.check) encontrada)"
              } else {
                Write-Host "::warning::$($lib.name) descargada pero no contiene $($lib.check) - revisa el contenido"
              }
              $ok++
            } catch {
              Write-Host "::warning::No se pudo extraer $($lib.name): $($_.Exception.Message)"
            }
          }
          Write-Host "=== Dependencias instaladas: $ok/4 ==="

      - name: Localizar Delphi (dcc32)
        id: dcc
        timeout-minutes: 6
        shell: pwsh
        env:
          DELPHI_SETUP_URL: ${{ secrets.DELPHI_SETUP_URL }}
        run: |
          function Find-Dcc {
            $found = $null
            foreach ($r in @('C:\Program Files (x86)\Embarcadero', 'C:\Program Files\Embarcadero', 'C:\Program Files\Borland', 'C:\Borland')) {
              if (Test-Path $r) {
                $found = Get-ChildItem -Path $r -Recurse -Filter dcc32.exe -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty FullName
                if ($found) { break }
              }
            }
            return $found
          }
          $dcc = Find-Dcc
          if (-not $dcc -and $env:DELPHI_SETUP_URL) {
            Write-Host 'Descargando e instalando Delphi desde el secreto DELPHI_SETUP_URL...'
            $setup = Join-Path $env:RUNNER_TEMP 'delphi_setup.exe'
            Invoke-WebRequest -Uri $env:DELPHI_SETUP_URL -OutFile $setup -UseBasicParsing -TimeoutSec 600
            Start-Process -FilePath $setup -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-' -Wait
            $dcc = Find-Dcc
            if (-not $dcc) {
              Write-Host '::error::El instalador del secreto DELPHI_SETUP_URL no dejo dcc32.exe en el sistema. Nota: la Community Edition gratuita bloquea dcc32 (no sirve para CI).'
              exit 1
            }
          }
          if (-not $dcc) {
            Write-Host '::warning::Sin compilador Delphi no se puede generar Ares.exe. Las dependencias SI quedaron instaladas. Para activar la compilacion: crea el secreto DELPHI_SETUP_URL (instalador de Delphi no-CE) o usa un runner self-hosted con Delphi.'
            "found=false" >> $env:GITHUB_OUTPUT
            exit 0
          }
          Write-Host "dcc32 encontrado: $dcc"
          Add-Content -Path $env:GITHUB_ENV -Value "DCC32=$dcc"
          "found=true" >> $env:GITHUB_OUTPUT

      - name: Preparar configuracion de compilacion (ci_build.cfg)
        if: steps.dcc.outputs.found == 'true'
        shell: pwsh
        run: |
          $ws = $env:GITHUB_WORKSPACE
          $dccDir = Split-Path $env:DCC32 -Parent
          $dccRoot = Split-Path $dccDir -Parent
          $dirs = New-Object System.Collections.Generic.List[string]
          $dirs.Add($ws)
          $dirs.Add((Join-Path $ws 'VCLs'))
          $libs = Join-Path $ws '_libs'
          if (Test-Path $libs) {
            Get-ChildItem $libs -Recurse -Filter *.pas -ErrorAction SilentlyContinue | ForEach-Object { $dirs.Add($_.DirectoryName) }
          }
          @("$dccRoot\lib", "$dccRoot\lib\win32\release", "$dccRoot\lib\Win32\release") | ForEach-Object {
            if (Test-Path $_) { $dirs.Add($_) }
          }
          $dirs = $dirs | Select-Object -Unique
          $lines = @('-B', '-E_output')
          if ($dccRoot -match 'Embarcadero') {
            $lines += '-NSSystem;Winapi;Vcl;System.Win;Data;Xml'
          }
          foreach ($d in $dirs) {
            $lines += ('-U"' + $d + '"')
            $lines += ('-I"' + $d + '"')
          }
          foreach ($d in @($ws, (Join-Path $ws 'VCLs'))) {
            $lines += ('-R"' + $d + '"')
          }
          Set-Content -Path (Join-Path $ws 'ci_build.cfg') -Value $lines -Encoding ASCII
          Write-Host ('Config generada con ' + $dirs.Count + ' rutas de busqueda de unidades')

      - name: Compilar Ares.DPR
        if: steps.dcc.outputs.found == 'true'
        shell: pwsh
        run: |
          Set-Location $env:GITHUB_WORKSPACE
          Write-Host "Compilando con: $env:DCC32"
          & $env:DCC32 '@ci_build.cfg' 'Ares.DPR'
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::dcc32 termino con codigo $LASTEXITCODE. Revisa el log: las unidades faltantes aparecen como 'File not found' y los errores de codigo justo encima."
            exit $LASTEXITCODE
          }
          Get-ChildItem '_output' -Filter *.exe -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "Generado: $($_.FullName)" }

      - name: Subir Ares.exe como artefacto
        if: steps.dcc.outputs.found == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: AresGalaxy-Win32
          path: _output/*.exe
          if-no-files-found: ignore
